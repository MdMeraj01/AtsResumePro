<div class="resume-template emerald-theme" id="resume-preview-area">
    
    <!-- LEFT SIDEBAR (DUAL-TONE: DARK SLATE + EMERALD GREEN) -->
    <aside class="sidebar">
        <!-- Photo Container with Dark Slate Background Block -->
        <div class="sidebar-top-block">
            <div class="photo-container" id="wrap-photo">
                <img id="preview-image" src="" alt="Profile Photo" style="display: none;">
            </div>
        </div>

        <div class="sidebar-content">
            <!-- CONTACT DETAILS -->
            <div class="sidebar-section contact-info">
                <div id="wrap-address" class="contact-item" style="display: none;">
                    <i class="fas fa-map-marker-alt"></i>
                    <span id="preview-address"></span>
                </div>
                <div id="wrap-phone" class="contact-item" style="display: none;">
                    <i class="fas fa-phone-alt"></i>
                    <span id="preview-phone"></span>
                </div>
                <div id="wrap-email" class="contact-item" style="display: none;">
                    <i class="fas fa-paper-plane"></i>
                    <span id="preview-email"></span>
                </div>
                <div id="wrap-linkedin" class="contact-item" style="display: none;">
                    <i class="fab fa-linkedin-in"></i>
                    <span id="preview-linkedin"></span>
                </div>
                <div id="wrap-github" class="contact-item" style="display: none;">
                    <i class="fab fa-github"></i>
                    <span id="preview-github"></span>
                </div>
                <div id="wrap-portfolio" class="contact-item" style="display: none;">
                    <i class="fas fa-globe"></i>
                    <span id="preview-portfolio"></span>
                </div>
                <div id="preview-socials"></div>
            </div>

            <!-- EDUCATION -->
            <div id="section-education" class="sidebar-section">
                <h3 class="sidebar-title">EDUCATION</h3>
                <div class="sidebar-line"></div>
                <div id="preview-education" class="sidebar-list-content"></div>
            </div>

            <!-- CERTIFICATIONS -->
            <div id="section-certifications" class="sidebar-section" style="display: none;">
                <h3 class="sidebar-title">CERTIFICATIONS</h3>
                <div class="sidebar-line"></div>
                <div id="preview-certifications" class="sidebar-list-content cert-bullets"></div>
            </div>

            <!-- SKILLS -->
            <div id="section-skills" class="sidebar-section">
                <h3 class="sidebar-title">SKILLS</h3>
                <div class="sidebar-line"></div>
                <div class="sidebar-skills-block">
                    <div id="wrap-tech-skills" class="skill-group">
                        <ul id="preview-skills" class="sidebar-bullet-list"></ul>
                    </div>
                    <div id="wrap-soft-skills" class="skill-group">
                        <ul id="preview-soft-skills" class="sidebar-bullet-list"></ul>
                    </div>
                    <div id="wrap-tools-skills" class="skill-group">
                        <ul id="preview-tools-skills" class="sidebar-bullet-list"></ul>
                    </div>
                </div>
            </div>

            <!-- HOBBIES / INTERESTS -->
            <div id="section-hobbies" class="sidebar-section" style="display: none;">
                <h3 class="sidebar-title">INTERESTS</h3>
                <div class="sidebar-line"></div>
                <ul id="preview-hobbies" class="sidebar-bullet-list"></ul>
            </div>
        </div>
    </aside>

    <!-- RIGHT MAIN CONTENT -->
    <main class="main-content">
        <!-- HEADER NAME & TITLE -->
        <header class="main-header">
            <h1 id="preview-name" class="name">YOUR NAME</h1>
            <p id="preview-title" class="job-title" style="display: none;"></p>
        </header>

        <!-- PROFESSIONAL SUMMARY -->
        <section id="section-summary" class="main-section">
            <h2 class="main-title">PROFESSIONAL SUMMARY</h2>
            <div class="main-line"></div>
            <p id="preview-profile" class="section-text"></p>
        </section>

        <!-- WORK EXPERIENCE -->
        <section id="section-experience" class="main-section">
            <h2 class="main-title">EXPERIENCE</h2>
            <div class="main-line"></div>
            <div id="preview-experience"></div>
        </section>

        <!-- PROJECTS -->
        <section id="section-projects" class="main-section" style="display: none;">
            <h2 class="main-title">PROJECTS</h2>
            <div class="main-line"></div>
            <div id="preview-projects"></div>
        </section>

        <!-- LANGUAGES -->
        <section id="section-languages" class="main-section" style="display: none;">
            <h2 class="main-title">LANGUAGES</h2>
            <div class="main-line"></div>
            <ul id="preview-languages" class="language-bars-list"></ul>
        </section>
    </main>

</div>
