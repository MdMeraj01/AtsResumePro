<div class="resume-template executive-theme" id="resume-preview-area">
    
    <!-- HEADER -->
    <header class="executive-header">
        <div class="header-photo" id="wrap-photo">
            <img id="preview-image" src="" alt="Profile" style="display: none;">
        </div>

        <div class="header-main">
            <h1 id="preview-name" class="name">YOUR NAME</h1>
            <p id="preview-title" class="job-title">JOB TITLE</p>
            
            <div class="contact-bar">
                <span id="wrap-email" style="display: none;">
                    <i class="fas fa-envelope icon"></i><span id="preview-email"></span>
                </span>
                <span id="wrap-phone" style="display: none;">
                    <i class="fas fa-phone icon"></i><span id="preview-phone"></span>
                </span>
                <span id="wrap-address" style="display: none;">
                    <i class="fas fa-map-marker-alt icon"></i><span id="preview-address"></span>
                </span>
                <span id="wrap-linkedin" style="display: none;">
                    <i class="fab fa-linkedin icon"></i><span id="preview-linkedin"></span>
                </span>
                <span id="wrap-github" style="display: none;">
                    <i class="fab fa-github icon"></i><span id="preview-github"></span>
                </span>
                <span id="wrap-portfolio" style="display: none;">
                    <i class="fas fa-globe icon"></i><span id="preview-portfolio"></span>
                </span>
                <div id="preview-socials"></div>
            </div>
        </div>
    </header>

    <!-- PROFESSIONAL SUMMARY -->
    <section id="section-summary" class="executive-section">
        <h2 class="section-title">PROFESSIONAL SUMMARY</h2>
        <p id="preview-profile" class="section-content"></p>
    </section>

    <!-- WORK EXPERIENCE -->
    <section id="section-experience" class="executive-section">
        <h2 class="section-title">WORK EXPERIENCE</h2>
        <div id="preview-experience"></div>
    </section>

    <!-- PROJECTS -->
    <section id="section-projects" class="executive-section" style="display: none;">
        <h2 class="section-title">KEY PROJECTS</h2>
        <div id="preview-projects"></div>
    </section>

    <!-- EDUCATION -->
    <section id="section-education" class="executive-section">
        <h2 class="section-title">EDUCATION</h2>
        <div id="preview-education"></div>
    </section>

    <!-- SKILLS & ADDITIONAL INFORMATION -->
    <section id="section-skills" class="executive-section">
        <h2 class="section-title">SKILLS & EXPERTISE</h2>
        
        <div class="skills-wrapper">
            <div class="skill-row" id="wrap-tech-skills">
                <span class="skill-label">Technical Skills:</span>
                <span id="preview-skills" class="skill-value"></span>
            </div>
            
            <div class="skill-row" id="wrap-soft-skills">
                <span class="skill-label">Soft Skills:</span>
                <span id="preview-soft-skills" class="skill-value"></span>
            </div>
            
            <div class="skill-row" id="wrap-tools-skills">
                <span class="skill-label">Tools & Frameworks:</span>
                <span id="preview-tools-skills" class="skill-value"></span>
            </div>

            <div class="skill-row" id="section-certifications" style="display: none;">
                <span class="skill-label">Certifications:</span>
                <div id="preview-certifications" class="skill-value block-cert"></div>
            </div>

            <div class="skill-row" id="section-languages" style="display: none;">
                <span class="skill-label">Languages:</span>
                <ul id="preview-languages" class="inline-list skill-value"></ul>
            </div>

            <div class="skill-row" id="section-hobbies" style="display: none;">
                <span class="skill-label">Interests:</span>
                <ul id="preview-hobbies" class="inline-list skill-value"></ul>
            </div>
        </div>
    </section>

</div>
