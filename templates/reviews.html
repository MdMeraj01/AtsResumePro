<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews & Ratings | ATS Resume Builder Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="{{ url_for('static', filename='css/reviews.css') }}" rel="stylesheet">
</head>
<body class="bg-[#0b0f19] text-white min-h-screen">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800/80 py-4 px-6 sticky top-0 bg-[#0b0f19]/90 backdrop-blur-md z-40">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-indigo-400 font-bold hover:text-indigo-300">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>
            <h1 class="text-lg font-bold text-white tracking-wide">User Reviews</h1>
            <div class="w-16"></div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="text-center max-w-2xl mx-auto mb-12">
            <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight">Community Feedback</h2>
            <p class="text-gray-400 mt-3 text-sm">See how job seekers around the world boosted their interview callbacks.</p>
        </div>

        <!-- All Reviews Grid -->
        <div id="allReviewsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-16">
                <i class="fas fa-spinner fa-spin text-3xl text-indigo-500"></i>
                <p class="text-gray-400 mt-3 text-sm">Loading all verified reviews...</p>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/reviews.js') }}"></script>
</body>
</html>
